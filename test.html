<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Uploading...</title>

<!-- โหลดฟอนต์ Mali -->
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    font-family: 'Mali', sans-serif;
    background: #ffffff;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    width: 90%;
    max-width: 500px;
    text-align: center;
  }

  .title {
    font-size: 22px;
    margin-bottom: 20px;
  }

  .progress-container {
    width: 100%;
    height: 12px;
    background: #e5e5e5;
    border-radius: 50px;
    overflow: hidden;
  }

  .progress-bar {
    width: 10%;
    height: 100%;
    background: linear-gradient(90deg, #4facfe, #00f2fe);
    border-radius: 50px;
    position: relative;
  }

  .progress-bar::after {
    content: "";
    position: absolute;
    top: 0;
    left: -40%;
    width: 40%;
    height: 100%;
    background: rgba(255,255,255,0.5);
    animation: shine 1.5s infinite;
  }

  @keyframes shine {
    100% { left: 100%; }
  }

  .percent {
    margin-top: 12px;
    font-size: 16px;
    color: #444;
  }

  .spinner {
    margin: 25px auto;
    width: 45px;
    height: 45px;
    border: 4px solid #eee;
    border-top: 4px solid #4facfe;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    100% { transform: rotate(360deg); }
  }
</style>
</head>

<body>

<div class="container">
  <div class="title">กำลังอัปโหลดข้อมูล...</div>

  <div class="spinner"></div>

  <div class="progress-container">
    <div class="progress-bar"></div>
  </div>

  <div class="percent">10%</div>
</div>

</body>
</html>
