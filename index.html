<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจองห้องประชุม PRO</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#667eea,#764ba2);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.container {
  background: #fff;
  padding: 25px;
  border-radius: 16px;
  width: 380px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

h2 { text-align: center; margin-bottom: 10px; }

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.time-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 10px;
}

.time-btn {
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #ccc;
  cursor: pointer;
  text-align: center;
  background: #f5f5f5;
}

.time-btn.selected {
  background: #007bff;
  color: white;
}

.time-btn.disabled {
  background: #ddd;
  color: #999;
  cursor: not-allowed;
}

button {
  background: #28a745;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover { background: #218838; }

</style>
</head>
<body>

<div class="container">
  <h2>จองห้องประชุม</h2>

  <input type="text" id="name" placeholder="ชื่อผู้จอง">
  <input type="date" id="date" onchange="loadBookings()">

  <div class="time-grid" id="timeGrid"></div>

  <button onclick="submitBooking()">จองห้อง</button>
</div>

<script>
const times = [
"08:00 - 09:00","09:00 - 10:00","10:00 - 11:00",
"11:00 - 12:00","12:00 - 13:00","13:00 - 14:00",
"14:00 - 15:00","15:00 - 16:00","16:00 - 17:00","17:00 - 18:00"
];

let selected = [];
let booked = [];

const grid = document.getElementById("timeGrid");

times.forEach(t => {
  const btn = document.createElement("div");
  btn.innerText = t;
  btn.className = "time-btn";

  btn.onclick = () => {
    if (btn.classList.contains("disabled")) return;

    if (btn.classList.contains("selected")) {
      btn.classList.remove("selected");
      selected = selected.filter(x => x !== t);
    } else {
      if (selected.length >= 3) {
        alert("จองได้ไม่เกิน 3 ชั่วโมง");
        return;
      }
      btn.classList.add("selected");
      selected.push(t);
    }
  };

  grid.appendChild(btn);
});

function loadBookings() {
  const date = document.getElementById("date").value;
  if (!date) return;

  fetch("https://script.google.com/macros/s/AKfycbzrOiZIjTwKCqSq1zED8aVU9jXnx9_6AtW6cKmMOrhCJEe_oUsqU24fJQxK80Cq5TjL/exec")
    .then(res => res.json())
    .then(data => {
      booked = data.filter(b => b.date === date).map(b => b.times.split(", ")).flat();

      document.querySelectorAll(".time-btn").forEach(btn => {
        if (booked.includes(btn.innerText)) {
          btn.classList.add("disabled");
        } else {
          btn.classList.remove("disabled");
        }
      });
    });
}

function submitBooking() {
  const name = document.getElementById("name").value;
  const date = document.getElementById("date").value;

  if (!name || !date || selected.length === 0) {
    alert("กรอกข้อมูลให้ครบ");
    return;
  }

  fetch("PUT_YOUR_SCRIPT_URL_HERE", {
    method: "POST",
    body: JSON.stringify({ name, date, times: selected.join(", ") })
  })
  .then(res => res.text())
  .then(() => {
    alert("จองสำเร็จ");
    location.reload();
  });
}
</script>

</body>
</html>
